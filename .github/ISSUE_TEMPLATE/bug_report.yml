name: Bug report
description: Something is decoded or encoded wrongly, or the library crashes or misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems (crashes, hangs or memory growth on hostile input), please use the Security tab instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate version or commit.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the library reported or did, and what you expected instead. If you think it disagrees with SMPTE ST 336, say which section.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Code, and how the input was fed (whole buffer or chunks, chunk size, options).
      render: rust
  - type: textarea
    id: input
    attributes:
      label: Input
      description: |
        If you can share it, a hex dump of the KLV that shows the problem (`xxd capture.klv | head`), or the source and encoder that produced it.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, x86_64, Rust 1.83
